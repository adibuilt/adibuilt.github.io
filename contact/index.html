<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact — Adi Built</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    form {
      margin-top: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      font: inherit;
      box-sizing: border-box;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Contact</h1>

  <p>
    Found an error in my notes, have a suggestion,
    or just want to share some feedback?
  </p>

  <form>
    <label for="name">Name</label>
    <input type="text" id="name" name="name">

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="message">Message</label>
    <textarea id="message" name="message"></textarea>

    <button type="submit">Send</button>
  </form>

</body>
</html>
